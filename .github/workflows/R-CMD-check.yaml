name: R-CMD-check

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          # DuckDB does not publish an R-devel binary; dependency compatibility
          # belongs in a dedicated job rather than a 30-minute source build here.
          - {os: ubuntu-latest, r: release, quack: true}
          - {os: ubuntu-latest, r: '4.3'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      CANARDABSURD_REQUIRE_QUACK: ${{ matrix.config.quack || 'false' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: ${{ matrix.config.r }}
          # 'always' also serves macOS binaries from Posit Package Manager.
          # CRAN now ships zstd-compressed macOS .tgz files, which pak cannot extract.
          use-public-rspm: always
          extra-repositories: https://sounkou-bioinfo.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install Quack for required integration tests
        if: matrix.config.quack
        run: make quack

      - name: Verify generated documentation
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: |
          make document
          git diff --exit-code -- NAMESPACE README.md man

      - uses: r-lib/actions/check-r-package@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

      - name: Show tinytest output on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::tinytest output"
          find check -name 'tinytest.Rout*' -exec cat '{}' \; || true
          echo "::endgroup::"

  coordinator-extension:
    name: C API v1 coordinator / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: release
          # 'always' also serves macOS binaries from Posit Package Manager.
          # CRAN now ships zstd-compressed macOS .tgz files, which pak cannot extract.
          use-public-rspm: always
          extra-repositories: https://sounkou-bioinfo.r-universe.dev

      - name: Install runtime test dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("bit64", "DBI", "duckdb", "S7", "callr", "tinytest"))
          stopifnot(packageVersion("duckdb") >= "1.5.5")

      - name: Install CanardAbsurd from this checkout
        shell: bash
        run: R CMD INSTALL .

      - name: Fetch DuckDB 1.5.5
        shell: bash
        run: git clone --branch v1.5.5 --depth 1 https://github.com/duckdb/duckdb.git artifacts/upstream/duckdb

      - name: Configure the coordinator extension
        shell: bash
        run: |
          cmake -S artifacts/upstream/duckdb -B artifacts/coordinator-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHELL=OFF \
            -DBUILD_UNITTESTS=OFF \
            -DDUCKDB_EXTENSION_CONFIGS="$PWD/tools/canard-coordinator/extension_config.cmake"

      - name: Build the coordinator extension
        shell: bash
        run: cmake --build artifacts/coordinator-build --config Release --target canard_coordinator_loadable_extension -j 2

      - name: Exercise the extension through DuckDB R
        shell: bash
        run: |
          extension=$(find artifacts/coordinator-build -type f -name 'canard_coordinator.duckdb_extension' -print -quit)
          test -n "$extension"
          Rscript tools/canard-coordinator/test/test-v1.R "$extension"

      - name: Exercise the package coordinator lifecycle
        shell: bash
        run: |
          extension=$(find artifacts/coordinator-build -type f -name 'canard_coordinator.duckdb_extension' -print -quit)
          export CANARDABSURD_COORDINATOR_EXTENSION="$extension"
          # tinytest runs from the test directory, so pass an absolute path.
          Rscript -e 'Sys.setenv(CANARDABSURD_COORDINATOR_EXTENSION = normalizePath(Sys.getenv("CANARDABSURD_COORDINATOR_EXTENSION"), mustWork = TRUE)); results <- tinytest::run_test_file(system.file("tinytest", "test_coordinator.R", package = "CanardAbsurd")); print(results); stopifnot(length(results) > 0L, all(vapply(results, isTRUE, logical(1L))))'
